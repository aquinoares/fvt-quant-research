name: FVT Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/fvt-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "tests/dashboard/**"
      - ".github/workflows/fvt-dashboard.yml"
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: fvt-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build evidence-backed dashboard
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dashboard source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js for dashboard fixture tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dashboard health, risk, and hash-chain tests
        run: node --test tests/dashboard/core.test.cjs

      - name: Restore latest private shadow snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          if git fetch --depth=1 origin refs/heads/p6-mom-runtime:refs/remotes/origin/p6-mom-runtime; then
            git worktree add --detach "$RUNNER_TEMP/fvt-p6-runtime" refs/remotes/origin/p6-mom-runtime
          else
            echo "Runtime branch not available yet; dashboard will show awaiting data."
          fi

      - name: Build sanitized dashboard feed
        env:
          GH_TOKEN: ${{ github.token }}
          PANEL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p site
          cp dashboard/index.html site/index.html
          python - <<'PY'
          import csv
          import hashlib
          import math
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root = Path(".")
          data_path = root / "dashboard" / "data.json"
          data = json.loads(data_path.read_text(encoding="utf-8"))
          manifest_rel = "research/out/p6_mom_freeze_20261024T011825Z/manifest.json"
          manifest_path = root / manifest_rel
          expected_manifest_blob = "d9f6a40ef73dff0eae8ca37a8a8c63e70b6e071e"
          actual_manifest_blob = subprocess.check_output(
              ["git", "rev-parse", "HEAD:" + manifest_rel], text=True
          ).strip()
          if actual_manifest_blob != expected_manifest_blob:
              raise SystemExit("Frozen P6-MOM manifest Git blob mismatch; dashboard build stopped.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("protocol") != "P6-MOM" or manifest.get("variant") != "MOM_TF240_LB96":
              raise SystemExit("Frozen manifest protocol/variant differs; dashboard build stopped.")

          ledger_path = root / "memory" / "hypotheses_ledger.jsonl"
          ledger_records = [
              json.loads(line)
              for line in ledger_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          start_records = [item for item in ledger_records if item.get("id") == "P6-MOM-START"]
          if len(start_records) != 1:
              raise SystemExit("Expected exactly one P6-MOM-START record for dashboard manifest provenance.")
          start_record = start_records[0]
          if start_record.get("frozen_manifest") != manifest_rel:
              raise SystemExit("Frozen manifest path in the start ledger does not match the build.")
          registered_manifest_sha = start_record.get("frozen_manifest_sha256")
          if not isinstance(registered_manifest_sha, str) or not re.fullmatch(r"[0-9a-fA-F]{64}", registered_manifest_sha):
              raise SystemExit("The start ledger has no valid registered frozen manifest SHA-256.")
          data["dashboard_version"] = "0.3.0"
          strategy = data.setdefault("strategy", {})
          strategy.update({
              "protocol": manifest["protocol"],
              "variant": manifest["variant"],
              "signal_timeframe_minutes": manifest.get("config", {}).get("tf"),
              "lookback": manifest.get("config", {}).get("lookback"),
              "threshold": manifest.get("config", {}).get("thr"),
              "risk_limit": manifest.get("risk_limit_drawdown_net"),
              "winner_id": manifest.get("winner_id"),
              "manifest_sha256": registered_manifest_sha.upper(),
              "execution": manifest.get("execution"),
          })
          historical = manifest.get("historical_selection_data")
          if not isinstance(historical, dict):
              raise SystemExit("Frozen manifest lacks historical_selection_data.")
          if not isinstance(historical.get("winner_train"), dict) or not isinstance(historical.get("winner_val"), dict):
              raise SystemExit("Frozen manifest lacks the registered train/validation results.")
          data["historical"] = {
              "source": manifest_rel,
              "train": historical["winner_train"],
              "validation": historical["winner_val"],
              "test_block_untouched": historical.get("test_block_untouched"),
          }
          # Read-only historical comparators from a versioned strategy-search artifact.
          best_config_rel = "research/out/strategy_search_20261023T035848Z/best_config.json"
          best_config_path = root / best_config_rel
          history = data["historical"]
          history["best_config_source"] = best_config_rel
          history["best_net_trade"] = None
          history["buy_and_hold"] = None
          history["buy_and_hold_source"] = best_config_rel
          history["buy_and_hold_note"] = "não recalculado neste painel"
          history["buy_and_hold_reason"] = "Arquivo versionado inacessível ou campos numéricos ausentes; pendência explícita."
          projection = data.setdefault("operations_projection", {})
          projection.update({
              "minimum_complete_trades": None,
              "reference_trades": None,
              "reference_days": None,
              "target_days": 90,
              "source": best_config_rel,
              "projection_note": "projeção aritmética, não é observação prospectiva",
              "minimum_source": manifest_rel,
          })
          minimum_spec = (manifest.get("frozen_acceptance_criteria") or {}).get("min_complete_trades")
          minimum_match = re.search(r"\d+", str(minimum_spec)) if minimum_spec is not None else None
          projection["minimum_complete_trades"] = int(minimum_match.group(0)) if minimum_match else None
          def finite_number(value):
              return isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value)
          if best_config_path.is_file():
              try:
                  best_config = json.loads(best_config_path.read_text(encoding="utf-8"))
                  winner_train = best_config.get("winner_train") or {}
                  winner_val = best_config.get("winner_val") or {}
                  bh = best_config.get("buy_and_hold_net") or {}
                  best_trade = winner_train.get("best_net_trade")
                  bh_train, bh_val = bh.get("train"), bh.get("val")
                  if finite_number(best_trade):
                      history["best_net_trade"] = best_trade
                  if finite_number(bh_train) and finite_number(bh_val):
                      history["buy_and_hold"] = {"train": bh_train, "validation": bh_val}
                      history["buy_and_hold_reason"] = None
                  total_trades = winner_train.get("trades")
                  val_trades = winner_val.get("trades")
                  dev_rows = best_config.get("dev_rows")
                  if (isinstance(total_trades, int) and not isinstance(total_trades, bool)
                      and isinstance(val_trades, int) and not isinstance(val_trades, bool)
                      and finite_number(dev_rows) and dev_rows > 0):
                      projection["reference_trades"] = total_trades + val_trades
                      projection["reference_days"] = dev_rows / 1440
              except (OSError, json.JSONDecodeError, TypeError, ValueError):
                  history["buy_and_hold_reason"] = "Arquivo best_config.json ilegível; valores ocultados."
          else:
              history["buy_and_hold_reason"] = "research/out/strategy_search_20261023T035848Z/best_config.json não acessível no build."
          criteria = manifest.get("frozen_acceptance_criteria")
          data["frozen_acceptance_criteria"] = criteria if isinstance(criteria, dict) else None
          data["source_label"] = "Snapshot gerado pelo workflow FVT Dashboard a partir do branch de estado; CSVs brutos não são publicados."

          def cron_from_workflow(path):
              if not path.is_file():
                  return None
              in_schedule = False
              for line in path.read_text(encoding="utf-8").splitlines():
                  if re.match(r"^\s{2}schedule:\s*$", line):
                      in_schedule = True
                      continue
                  if in_schedule and re.match(r"^\s{2}\w", line) and not re.match(r"^\s{4,}", line):
                      break
                  if in_schedule:
                      match = re.search(r"cron:\s*['\"]([^'\"]+)['\"]", line)
                      if match:
                          return match.group(1)
              return None

          collector_workflow_path = root / ".github" / "workflows" / "p6-mom-cloud-live.yml"
          collector_cron = cron_from_workflow(collector_workflow_path)
          dashboard_cron = cron_from_workflow(root / ".github" / "workflows" / "fvt-dashboard.yml")

          def collector_tolerance_seconds(path):
              # Read-only: compare the two existing collector guards without changing the collector.
              try:
                  source = path.read_text(encoding="utf-8")
              except OSError:
                  return None

              def guard_values(variable):
                  prefix = 'if [ "$' + variable + '" -gt '
                  suffix = " ]; then"
                  values = []
                  for line in source.splitlines():
                      candidate = line.strip()
                      if candidate.startswith(prefix) and candidate.endswith(suffix):
                          value = candidate[len(prefix):-len(suffix)]
                          if not value.isdigit():
                              return None
                          values.append(int(value))
                  return values

              continuity = guard_values("age_seconds")
              initial = guard_values("seconds_after_start")
              if continuity is None or initial is None or len(continuity) != 1 or len(initial) != 1:
                  return None
              if continuity[0] != initial[0]:
                  return None
              return continuity[0] if continuity[0] >= 0 else None

          incident_tolerance_seconds = collector_tolerance_seconds(collector_workflow_path)
          data["health_schedule"] = {
              "collector_cron": collector_cron,
              "dashboard_cron": dashboard_cron,
          }

          server_time_ms = None
          try:
              request = urllib.request.Request(
                  "https://api.binance.com/api/v3/time",
                  headers={"Accept": "application/json", "User-Agent": "FVT-Dashboard/0.3"},
              )
              with urllib.request.urlopen(request, timeout=6) as response:
                  server_time_ms = int(json.load(response)["serverTime"])
          except Exception:
              server_time_ms = None
          now_ms = server_time_ms if isinstance(server_time_ms, int) else int(datetime.now(timezone.utc).timestamp() * 1000)
          cutoff_ms = now_ms - int(timedelta(hours=48).total_seconds() * 1000)

          runtime = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "fvt-p6-runtime"
          session_rel = Path("data/shadow/p6_mom_mom_tf240_lb96_20261025T000000Z")
          session = runtime / session_rel
          shadow = data.setdefault("shadow", {})
          shadow.update({
              "status": "awaiting",
              "status_label": "AGUARDANDO",
              "status_detail": "Nenhum checkpoint prospectivo sincronizado ainda.",
              "max_drawdown_net": None,
              "breached": None,
              "last_timestamp": None,
              "state_updated_at_utc": None,
              "position_state": None,
              "entry_price": None,
              "entry_time_utc": None,
              "next_close_4h_utc": None,
              "segments_count": None,
              "candles_observed": None,
              "risk_updated_at_utc": None,
              "continuity": "Ainda não verificada",
              "events": [],
              "incident": {
                  "event": None,
                  "at_utc": None,
                  "tolerance_seconds": incident_tolerance_seconds,
                  "delay_seconds": None,
              },
          })

          state_path = session / "state.json"
          risk_path = session / "risk_monitor.json"
          event_path = session / "events.jsonl"
          stop_path = session / "reports" / "scheduler_stop.json"
          segment_dir = session / "segments"
          segment_files = sorted(segment_dir.glob("*.csv")) if segment_dir.is_dir() else []

          if event_path.is_file():
              for line in event_path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      try:
                          shadow["events"].append(json.loads(line))
                      except json.JSONDecodeError:
                          shadow["events"].append({"event": "EVENT_PARSE_ERROR", "detail": "Registro de evento ilegível"})
          shadow["events"] = shadow["events"][-100:]

          def parse_timestamp_ms(value):
              if value is None or value == "":
                  return None
              if isinstance(value, (int, float)):
                  number = int(value)
                  return number * 1000 if abs(number) < 100000000000 else number
              text = str(value).strip()
              if text.isdigit():
                  number = int(text)
                  return number * 1000 if number < 100000000000 else number
              try:
                  parsed = datetime.fromisoformat(text.replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return int(parsed.astimezone(timezone.utc).timestamp() * 1000)
              except ValueError:
                  return None

          state = None
          if state_path.is_file():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              shadow["last_timestamp"] = state.get("last_timestamp")
              shadow["state_updated_at_utc"] = state.get("updated_at_utc")
              shadow["continuity"] = "Último segmento validado pelo coletor"
              raw_position = state.get("position")
              if raw_position == 0:
                  shadow["position_state"] = "fora"
              elif raw_position == 1:
                  shadow["position_state"] = "comprado"
              shadow["segments_count"] = len(segment_files)
              total_rows = 0
              recent_timestamps = []
              scan_ok = True
              for csv_path in segment_files:
                  try:
                      with csv_path.open("r", encoding="utf-8-sig", newline="") as stream:
                          reader = csv.DictReader(stream)
                          for row in reader:
                              total_rows += 1
                              # Only timestamps from the last 48h contribute to this rolling health window.
                              file_ts = parse_timestamp_ms(row.get("timestamp"))
                              if file_ts is None:
                                  scan_ok = False
                              elif cutoff_ms <= file_ts <= now_ms:
                                  recent_timestamps.append(file_ts)
                  except (OSError, csv.Error):
                      scan_ok = False
              shadow["candles_observed"] = total_rows if scan_ok and segment_files else None
              if risk_path.is_file():
                  risk = json.loads(risk_path.read_text(encoding="utf-8"))
                  dd = risk.get("max_drawdown_net")
                  shadow["max_drawdown_net"] = dd if isinstance(dd, (int, float)) else None
                  shadow["breached"] = risk.get("breached") if isinstance(risk.get("breached"), bool) else None
                  shadow["risk_updated_at_utc"] = risk.get("updated_at_utc")
              else:
                  shadow["max_drawdown_net"] = None
                  shadow["breached"] = None
                  shadow["risk_updated_at_utc"] = None

              terminal_events = {
                  "PROTOCOL_STOP_SCHEDULER_GAP", "PROTOCOL_STOP_INITIAL_SCHEDULER_GAP",
                  "RISK_LIMIT_BREACHED", "FATAL_SESSION_STOP", "COLLECTION_FAILURE",
                  "CLOUD_COLLECTOR_STOP",
              }
              terminal = next((event for event in reversed(shadow["events"]) if event.get("event") in terminal_events), None)
              try:
                  state_updated = datetime.fromisoformat(str(state.get("updated_at_utc")).replace("Z", "+00:00"))
                  if state_updated.tzinfo is None:
                      state_updated = state_updated.replace(tzinfo=timezone.utc)
                  state_age_seconds = max(0, (datetime.now(timezone.utc) - state_updated.astimezone(timezone.utc)).total_seconds())
              except (TypeError, ValueError):
                  state_age_seconds = None
              if shadow["breached"] is True:
                  shadow.update(status="risk_breach", status_label="RISCO ACIONADO", status_detail="Monitor registrou violação do limite aprovado; não retomar automaticamente.", continuity="Parada por limite de risco")
              elif terminal:
                  shadow.update(status="protocol_stopped", status_label="INTERROMPIDA", status_detail=terminal.get("detail") or terminal.get("event"), continuity="Interrupção registrada; investigar antes de retomar")
                  if terminal.get("event") == "PROTOCOL_STOP_INITIAL_SCHEDULER_GAP":
                      shadow["scheduler_notice"] = "agendamento desabilitado após parada de protocolo (esperado)"
              elif state_age_seconds is None or incident_tolerance_seconds is None or state_age_seconds > incident_tolerance_seconds:
                  if incident_tolerance_seconds is None:
                      stop_detail = "Tolerância do código existente do coletor não pôde ser lida sem ambiguidade; continuidade não confirmada e nenhuma métrica prospectiva foi sintetizada."
                  elif state_age_seconds is None:
                      stop_detail = "Timestamp do checkpoint ausente ou inválido; continuidade não confirmada e nenhuma métrica prospectiva foi sintetizada."
                  else:
                      stop_detail = f"Checkpoint atualizado há {int(state_age_seconds)} s, acima da tolerância lida do coletor ({incident_tolerance_seconds} s); nenhuma métrica prospectiva foi sintetizada."
                  shadow.update(status="protocol_stopped", status_label="SEM CONTINUIDADE", status_detail=stop_detail, continuity="Lacuna ou estado desatualizado")
              else:
                  shadow.update(status="running", status_label="SESSÃO ATIVA", status_detail="Checkpoint recente sincronizado; telemetria restrita ao protocolo.", continuity="Estado atualizado dentro da tolerância")
          elif stop_path.is_file():
              stop = json.loads(stop_path.read_text(encoding="utf-8"))
              shadow.update(status="protocol_stopped", status_label="INTERROMPIDA", status_detail=stop.get("detail") or stop.get("event"), continuity="A sessão não contém checkpoint de estado")
              if not shadow["events"]:
                  shadow["events"].append(stop)

          # Publish structured incident fields; never parse a metric from event prose.
          incident_event = next((
              event for event in reversed(shadow["events"])
              if isinstance(event, dict) and event.get("event") in {
                  "PROTOCOL_STOP_SCHEDULER_GAP", "PROTOCOL_STOP_INITIAL_SCHEDULER_GAP",
                  "RISK_LIMIT_BREACHED", "FATAL_SESSION_STOP", "COLLECTION_FAILURE",
                  "CLOUD_COLLECTOR_STOP",
              }
          ), None)
          raw_delay = incident_event.get("delay_seconds") if incident_event else None
          incident_delay_seconds = (
              raw_delay if isinstance(raw_delay, int) and not isinstance(raw_delay, bool) and raw_delay >= 0
              else None
          )
          shadow["incident"] = {
              "event": incident_event.get("event") if incident_event else None,
              "at_utc": incident_event.get("at_utc") if incident_event else None,
              "tolerance_seconds": incident_tolerance_seconds,
              "delay_seconds": incident_delay_seconds,
          }

          # Derive exact rolling 48h counts only from stored candle timestamps. A missing/invalid scan stays null.
          recent_unique = sorted(set(recent_timestamps)) if state is not None and scan_ok and segment_files else []
          if state is not None and scan_ok and segment_files:
              gaps = 0
              for index in range(1, len(recent_unique)):
                  delta = recent_unique[index] - recent_unique[index - 1]
                  if delta > 60000:
                      gaps += max(0, int(delta // 60000) - 1)
              collection_health = {
                  "last_open_time": shadow.get("last_timestamp"),
                  "candles_48h": len(recent_unique),
                  "gaps_48h": gaps,
                  "server_time_ms": server_time_ms,
              }
          else:
              collection_health = {
                  "last_open_time": shadow.get("last_timestamp"),
                  "candles_48h": None,
                  "gaps_48h": None,
                  "server_time_ms": server_time_ms,
              }
          data["collection_health"] = collection_health

          # Read workflow metadata without printing or storing the short-lived GitHub token.
          collector_meta = None
          token = os.environ.get("GH_TOKEN")
          api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          repo_name = os.environ.get("GITHUB_REPOSITORY", "")
          if token and repo_name:
              try:
                  request = urllib.request.Request(
                      api_base + "/repos/" + repo_name + "/actions/workflows/p6-mom-cloud-live.yml/runs?per_page=20",
                      headers={
                          "Authorization": "Bearer " + token,
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=8) as response:
                      run_payload = json.load(response)
                  runs = run_payload.get("workflow_runs", [])
                  if runs:
                      latest = runs[0]
                      head_branch = latest.get("head_branch")
                      head_sha = latest.get("head_sha")
                      collector_meta = {
                          "head_sha": head_sha,
                          "head_branch": head_branch,
                          "main_commit_sha": head_sha if head_branch == "main" else None,
                          "run_id": latest.get("id"),
                          "status": latest.get("status"),
                          "conclusion": latest.get("conclusion"),
                          "created_at": latest.get("created_at"),
                          "run_started_at": latest.get("run_started_at"),
                          "html_url": latest.get("html_url"),
                      }
              except Exception:
                  collector_meta = None

          panel_run_id = os.environ.get("GITHUB_RUN_ID")
          panel_repo = os.environ.get("GITHUB_REPOSITORY", "")
          panel_server = os.environ.get("GITHUB_SERVER_URL", "https://github.com").rstrip("/")
          panel_run = None
          if panel_run_id and panel_repo and panel_server == "https://github.com":
              panel_run = {
                  "run_id": panel_run_id,
                  "html_url": panel_server + "/" + panel_repo + "/actions/runs/" + panel_run_id,
                  "head_sha": os.environ.get("PANEL_COMMIT_SHA"),
              }

          data["audit"] = {
              "panel_commit_sha": os.environ.get("PANEL_COMMIT_SHA"),
              "panel_run": panel_run,
              "collector_last_run": collector_meta,
          }
          # Trilha A is independent and strictly exploratory; data comes from versioned report files.
          learning = data.setdefault("learning", {})
          learning.setdefault("label", "EXPLORATÓRIO — NÃO É PROVA")
          learning.setdefault("status", "awaiting")
          learning.setdefault("coverage_percent", None)
          learning.setdefault("coverage_minutes_present", None)
          learning.setdefault("coverage_minutes_expected", None)
          learning.setdefault("first_candle_open_time_utc", None)
          learning.setdefault("daily_gaps", [])
          learning.setdefault("report_available", False)
          learning.setdefault("quality_report_reason", "Nenhum relatório versionado disponível ainda.")
          learning.setdefault("report_source", "learning/reports/latest.json")
          learning.setdefault("experiment_count", None)
          learning.setdefault("experiment_count_source", "learning/experiments/registry.json")
          learning.setdefault("hypothesis_count", None)
          learning.setdefault("hypothesis_count_source", "learning/hypotheses.jsonl")
          learning.setdefault("backtest", None)
          learning.setdefault("backtest_source", "learning/experiments/latest_backtest.json")
          quality_path = root / "learning" / "reports" / "latest.json"
          if quality_path.is_file():
              try:
                  quality = json.loads(quality_path.read_text(encoding="utf-8"))
                  fields = {
                      "label": quality.get("label", "EXPLORATÓRIO — NÃO É PROVA"),
                      "status": quality.get("status", "unknown"),
                      "symbol": quality.get("symbol", "BTCUSDT"),
                      "interval": quality.get("interval", "1m"),
                      "latest_run_at_utc": quality.get("run_at_utc"),
                      "latest_candle_open_time_utc": quality.get("last_candle_open_time_utc"),
                      "candle_count_1m": quality.get("candle_count"),
                      "new_candles": quality.get("new_candles"),
                      "gaps_found": quality.get("gaps_found"),
                      "gaps_filled": quality.get("gaps_filled"),
                      "gaps_remaining": quality.get("gaps_remaining"),
                      "duplicates_removed": quality.get("duplicates_removed"),
                      "age_last_candle_seconds": quality.get("age_last_candle_seconds"),
                      "pending_backfill_candles": quality.get("pending_backfill_candles"),
                      "coverage_percent": quality.get("coverage_percent"),
                      "coverage_minutes_present": quality.get("coverage_minutes_present"),
                      "coverage_minutes_expected": quality.get("coverage_minutes_expected"),
                      "first_candle_open_time_utc": quality.get("first_candle_open_time_utc"),
                      "daily_gaps": quality.get("daily_gaps") if isinstance(quality.get("daily_gaps"), list) else [],
                      "message": quality.get("message", "Sem detalhe da última coleta."),
                  }
                  for key, value in fields.items():
                      learning[key] = value
                  learning["report_available"] = True
                  learning["quality_report_reason"] = None
                  run_id = quality.get("run_id")
                  learning["latest_run_url"] = ("https://github.com/aquinoares/fvt-quant-research/actions/runs/" + str(run_id)) if run_id else None
                  learning["latest_report_url"] = "https://github.com/aquinoares/fvt-quant-research/blob/main/learning/reports/latest.md"
                  Path("site/learning-report.json").write_text(json.dumps(quality, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              except (OSError, json.JSONDecodeError):
                  learning["report_available"] = False
                  learning["quality_report_reason"] = "learning/reports/latest.json ilegível; métricas omitidas."
          registry_path = root / "learning" / "experiments" / "registry.json"
          if registry_path.is_file():
              try:
                  registry = json.loads(registry_path.read_text(encoding="utf-8"))
                  experiments = registry.get("experiments")
                  learning["experiment_count"] = len(experiments) if isinstance(experiments, list) else None
              except (OSError, json.JSONDecodeError):
                  learning["experiment_count"] = None
          hypothesis_path = root / "learning" / "hypotheses.jsonl"
          if hypothesis_path.is_file():
              try:
                  learning["hypothesis_count"] = sum(1 for line in hypothesis_path.read_text(encoding="utf-8").splitlines() if line.strip())
              except OSError:
                  learning["hypothesis_count"] = None
          backtest_path = root / "learning" / "experiments" / "latest_backtest.json"
          if backtest_path.is_file():
              try:
                  learning["backtest"] = json.loads(backtest_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  learning["backtest"] = None
          # The status is a versioned feed field, not inferred from prose in the draft document.
          data.setdefault("decision", {"amendment_status": "rascunho — sem efeito", "source": "docs/EMENDA_PROTOCOLO_RASCUNHO.md"})
          data.setdefault("incident_timeline", {
              "source": "docs/EMENDA_PROTOCOLO_RASCUNHO.md; docs/DECISAO_TRILHAS_RASCUNHO.md; GitHub Actions run metadata",
              "records": [
                  {"at_utc":"2026-10-25T00:00:00Z","event":"WINDOW_START","label":"Início da janela","classification":"fato registrado","detail":"Início original da janela UTC, conforme a minuta versionada.","source_path":"docs/EMENDA_PROTOCOLO_RASCUNHO.md","source_url":"https://github.com/aquinoares/fvt-quant-research/blob/main/docs/EMENDA_PROTOCOLO_RASCUNHO.md"},
                  {"at_utc":"2026-10-25T00:15:00Z","event":"TICK_NO_RUN","label":"Tick de 00:15Z sem run registrado","classification":"inferência do diagnóstico","detail":"Achado do diagnóstico; não é evento persistido do coletor.","source_path":"docs/DECISAO_TRILHAS_RASCUNHO.md","source_url":"https://github.com/aquinoares/fvt-quant-research/blob/main/docs/DECISAO_TRILHAS_RASCUNHO.md"},
                  {"at_utc":"2026-10-25T00:47:50Z","event":"COLLECTOR_RUN","label":"Run do coletor iniciado","classification":"fato registrado","detail":"GitHub Actions run #40148089650; sucesso do workflow não valida a sessão.","source_path":"GitHub Actions run #40148089650","source_url":"https://github.com/aquinoares/fvt-quant-research/actions/runs/40148089650","run_id":40148089650},
                  {"at_utc":"2026-10-25T00:48:13.150235Z","event":"PROTOCOL_STOP_INITIAL_SCHEDULER_GAP","label":"PROTOCOL_STOP","classification":"fato registrado","detail":"Evento de parada registrado na documentação de incidente.","source_path":"docs/EMENDA_PROTOCOLO_RASCUNHO.md","source_url":"https://github.com/aquinoares/fvt-quant-research/blob/main/docs/EMENDA_PROTOCOLO_RASCUNHO.md"},
                  {"at_utc":"2026-10-25T00:48:14Z","event":"WORKFLOW_DISABLED","label":"Workflow desabilitado","classification":"fato registrado","detail":"Horário de desabilitação conforme o registro versionado.","source_path":"docs/DECISAO_TRILHAS_RASCUNHO.md","source_url":"https://github.com/aquinoares/fvt-quant-research/blob/main/docs/DECISAO_TRILHAS_RASCUNHO.md"}
              ]
          })
          data["updated_at_utc"] = datetime.now(timezone.utc).isoformat()

          # Save the feed and embed its current snapshot plus the tested core code in one HTML file.
          Path("site/data.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          index_path = Path("site/index.html")
          html = index_path.read_text(encoding="utf-8")
          data_marker = "<!-- FVT_RUNTIME_DATA -->"
          core_marker = "<!-- FVT_CORE_LOGIC -->"
          if data_marker not in html or core_marker not in html:
              raise SystemExit("Dashboard build markers are missing.")
          payload = json.dumps(data, ensure_ascii=False, separators=(",", ":")).replace("</", "<" + chr(92) + "/")
          embedded_data = "<script>window.FVT_DASHBOARD_DATA = " + payload + ";</script>"
          core_source = (root / "dashboard" / "core.js").read_text(encoding="utf-8")
          embedded_core = "<script>\n" + core_source + "\n</script>"
          html = html.replace(data_marker, embedded_data, 1)
          html = html.replace(core_marker, embedded_core, 1)
          index_path.write_text(html, encoding="utf-8")
          print("Dashboard snapshot generated. Missing source fields remain null; no live performance metric is synthesized.")
          PY

      - name: Upload static dashboard as a private workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fvt-dashboard-preview-${{ github.run_id }}
          path: site
          retention-days: 7
          if-no-files-found: error

      - name: Upload GitHub Pages artifact only with explicit public opt-in
        if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PUBLIC_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish dashboard (opt-in; may expose the page publicly)
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PUBLIC_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
