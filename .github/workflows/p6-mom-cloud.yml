name: P6-MOM Cloud Shadow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p6-mom-cloud.yml"
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: p6-mom-cloud-shadow
  cancel-in-progress: false

jobs:
  shadow:
    name: Collect and monitor frozen P6-MOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen code
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        id: deps
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify frozen P6-MOM manifest and code hashes
        id: freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path(".")
          manifest_rel = "research/out/p6_mom_freeze_20261024T011825Z/manifest.json"
          expected_manifest_sha = "661EAA0326B7B4C201E7A897FF58CD45382FB10DDACFECF4F0A6F89DB0B76592"
          manifest_path = root / manifest_rel
          actual_manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest().upper()
          if actual_manifest_sha != expected_manifest_sha:
              raise SystemExit("Frozen manifest SHA256 mismatch.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("protocol") != "P6-MOM" or manifest.get("variant") != "MOM_TF240_LB96":
              raise SystemExit("Unexpected protocol or variant in frozen manifest.")

          records = []
          for line in (root / "memory/hypotheses_ledger.jsonl").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  records.append(json.loads(line))
          starts = [r for r in records if r.get("id") == "P6-MOM-START"]
          risks = [r for r in records if r.get("id") == "P6-MOM-RISK"]
          if len(starts) != 1 or len(risks) != 1:
              raise SystemExit("P6-MOM start/risk record is missing or duplicated.")
          start, risk = starts[0], risks[0]
          if start.get("window_start_authorized") is not True:
              raise SystemExit("P6-MOM window start is not authorized in the ledger.")
          if start.get("window_start_utc") != "2026-10-25T00:00:00Z" or start.get("window_end_utc") != "2027-01-23T00:00:00Z":
              raise SystemExit("P6-MOM window dates differ from the registration.")
          if risk.get("status") != "ativo" or risk.get("risk_limit_approved") is not True:
              raise SystemExit("P6-MOM risk approval is not active.")
          if abs(float(risk.get("limit_drawdown_net", 0)) + 0.1) > 1e-12:
              raise SystemExit("P6-MOM risk threshold differs from the approved -10% limit.")

          expected_hashes = dict(manifest.get("code_sha256", {}))
          expected_hashes.update(start.get("code_sha256", {}))
          for rel, expected in expected_hashes.items():
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f"Frozen dependency is missing: {rel}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              if actual != str(expected).upper():
                  raise SystemExit(f"Frozen code SHA256 mismatch: {rel}")

          print(f"Frozen manifest verified; {len(expected_hashes)} dependency hashes verified.")
          print("Authorization, window dates, risk approval, and frozen variant match.")
          PY

      - name: Normalize approval reference path for Linux runner
        id: normalize
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ref_path = Path("memory/p6_mom_risk_approval_ref.json")
          ledger_path = Path("memory/hypotheses_ledger.jsonl").resolve()
          ref = json.loads(ref_path.read_text(encoding="utf-8"))
          ref["ledger"] = str(ledger_path)
          ref_path.write_text(json.dumps(ref, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if Path(ref["ledger"]).resolve() != ledger_path:
              raise SystemExit("Approval ledger path normalization failed.")
          print("Approval reference points to the committed P6-MOM ledger on this runner.")
          PY

      - name: Restore persistent P6-MOM session
        id: restore
        shell: bash
        run: |
          set -Eeuo pipefail
          SESSION_REL="data/shadow/p6_mom_mom_tf240_lb96_20261025T000000Z"
          RUNTIME="$RUNNER_TEMP/fvt-p6-runtime"

          git fetch origin refs/heads/p6-mom-runtime:refs/remotes/origin/p6-mom-runtime
          git worktree add --detach "$RUNTIME" refs/remotes/origin/p6-mom-runtime

          mkdir -p "$GITHUB_WORKSPACE/data/shadow"
          if [ -d "$RUNTIME/$SESSION_REL" ]; then
            cp -a "$RUNTIME/$SESSION_REL" "$GITHUB_WORKSPACE/data/shadow/"
          fi

          echo "Runtime branch restored; no performance metrics are printed."

      - name: Collect new candles and monitor risk only
        id: collect
        shell: bash
        run: |
          set -uo pipefail
          SESSION="$GITHUB_WORKSPACE/data/shadow/p6_mom_mom_tf240_lb96_20261025T000000Z"
          LOG="$RUNNER_TEMP/p6-mom.log"
          mkdir -p "$(dirname "$LOG")"

          # Strict continuity guard: do not retrospectively fill a missed run.
          if [ -f "$SESSION/state.json" ]; then
            age_seconds="$(python - "$SESSION/state.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          with open(sys.argv[1], encoding="utf-8") as fh:
              state = json.load(fh)
          updated = datetime.fromisoformat(state["updated_at_utc"].replace("Z", "+00:00"))
          print(max(0, int((datetime.now(timezone.utc) - updated).total_seconds())))
          PY
          )" || {
              echo "Unable to read persistent state; stopping safely."
              echo "exit_code=4" >> "$GITHUB_OUTPUT"
              echo "terminal=true" >> "$GITHUB_OUTPUT"
              exit 0
            }

            if [ "$age_seconds" -gt 2700 ]; then
              mkdir -p "$SESSION/reports"
              python - "$SESSION" "$age_seconds" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          session = Path(sys.argv[1])
          age = int(sys.argv[2])
          event = {
              "event": "PROTOCOL_STOP_SCHEDULER_GAP",
              "at_utc": datetime.now(timezone.utc).isoformat(),
              "detail": f"Last successful state is {age} seconds old; no retrospective backfill was attempted."
          }
          with (session / "events.jsonl").open("a", encoding="utf-8") as fh:
              fh.write(json.dumps(event, ensure_ascii=False) + "\n")
          (session / "reports" / "scheduler_stop.json").write_text(
              json.dumps(event, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
              echo "exit_code=4" >> "$GITHUB_OUTPUT"
              echo "terminal=true" >> "$GITHUB_OUTPUT"
              echo "Stopped: scheduled collection gap exceeded 45 minutes."
              printf 'Stopped: scheduled collection gap exceeded 45 minutes.\n' > "$LOG"
              exit 0
            fi
          fi

          # Do not start late with a synthetic historical backfill.
          if [ ! -f "$SESSION/state.json" ]; then
            seconds_after_start="$(python - <<'PY'
          from datetime import datetime, timezone
          start = datetime(2026, 10, 25, 0, 0, tzinfo=timezone.utc)
          print(int((datetime.now(timezone.utc) - start).total_seconds()))
          PY
          )" || {
              echo "Unable to evaluate initial window timing; stopping safely."
              echo "exit_code=4" >> "$GITHUB_OUTPUT"
              echo "terminal=true" >> "$GITHUB_OUTPUT"
              printf 'Unable to evaluate initial window timing.\n' > "$LOG"
              exit 0
            }

            if [ "$seconds_after_start" -gt 2700 ]; then
              mkdir -p "$SESSION/reports"
              python - "$SESSION" "$seconds_after_start" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          session, age = Path(sys.argv[1]), int(sys.argv[2])
          session.mkdir(parents=True, exist_ok=True)
          event = {
              "event": "PROTOCOL_STOP_INITIAL_SCHEDULER_GAP",
              "at_utc": datetime.now(timezone.utc).isoformat(),
              "detail": f"First cloud collection would begin {age} seconds after window start; no retrospective backfill was attempted."
          }
          with (session / "events.jsonl").open("a", encoding="utf-8") as fh:
              fh.write(json.dumps(event, ensure_ascii=False) + "\n")
          (session / "reports" / "scheduler_stop.json").write_text(
              json.dumps(event, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
              echo "exit_code=4" >> "$GITHUB_OUTPUT"
              echo "terminal=true" >> "$GITHUB_OUTPUT"
              echo "Stopped: initial cloud collection was more than 45 minutes late."
              printf 'Stopped: initial cloud collection was more than 45 minutes late.\n' > "$LOG"
              exit 0
            fi
          fi

          set +e
          python scripts/p6_mom_step.py 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if grep -q "JANELA_COMPLETA" "$LOG"; then
            echo "terminal=true" >> "$GITHUB_OUTPUT"
          else
            echo "terminal=false" >> "$GITHUB_OUTPUT"
          fi

          # Persist an operational error record, but no performance metrics.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
            mkdir -p "$SESSION"
            python - "$SESSION" "$rc" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          session, rc = Path(sys.argv[1]), int(sys.argv[2])
          session.mkdir(parents=True, exist_ok=True)
          event = {
              "event": "CLOUD_COLLECTOR_STOP",
              "at_utc": datetime.now(timezone.utc).isoformat(),
              "detail": f"p6_mom_step exit code {rc}; see workflow logs for the reason."
          }
          with (session / "events.jsonl").open("a", encoding="utf-8") as fh:
              fh.write(json.dumps(event, ensure_ascii=False) + "\n")
          PY
          fi

          echo "Collector exit code: $rc (5 means no new data or window boundary)."
          exit 0

      - name: Persist session checkpoint to private runtime branch
        id: persist
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          SESSION_REL="data/shadow/p6_mom_mom_tf240_lb96_20261025T000000Z"
          SESSION="$GITHUB_WORKSPACE/$SESSION_REL"
          RUNTIME="$RUNNER_TEMP/fvt-p6-runtime"

          if [ ! -d "$RUNTIME/.git" ] && [ ! -f "$RUNTIME/.git" ]; then
            echo "Runtime worktree unavailable; checkpoint cannot be persisted."
            exit 1
          fi

          if [ -d "$SESSION" ]; then
            mkdir -p "$RUNTIME/$(dirname "$SESSION_REL")"
            mkdir -p "$RUNTIME/$SESSION_REL"
            rsync -a --delete "$SESSION/" "$RUNTIME/$SESSION_REL/"
            git -C "$RUNTIME" config user.name "github-actions[bot]"
            git -C "$RUNTIME" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$RUNTIME" add -f -A -- "$SESSION_REL"

            if ! git -C "$RUNTIME" diff --cached --quiet; then
              git -C "$RUNTIME" commit -m "P6-MOM cloud checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git -C "$RUNTIME" push origin HEAD:refs/heads/p6-mom-runtime
            else
              echo "No persistent session changes to save."
            fi
          else
            echo "No session created yet; nothing to persist."
          fi

      - name: Stop schedule on breach, protocol stop, or fatal error
        if: ${{ always() && (
          steps.collect.outputs.exit_code == '2' ||
          steps.collect.outputs.exit_code == '3' ||
          steps.collect.outputs.exit_code == '4' ||
          steps.collect.outputs.terminal == 'true' ||
          steps.checkout.outcome == 'failure' ||
          steps.python.outcome == 'failure' ||
          steps.freeze.outcome == 'failure' ||
          steps.deps.outcome == 'failure' ||
          steps.normalize.outcome == 'failure' ||
          steps.restore.outcome == 'failure' ||
          steps.persist.outcome == 'failure'
        ) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --request PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/p6-mom-cloud.yml/disable"
          echo "Scheduled workflow disabled safely after protocol stop."

      - name: Upload operational log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p6-mom-operational-log-${{ github.run_id }}
          path: ${{ runner.temp }}/p6-mom.log
          if-no-files-found: ignore
          retention-days: 7
