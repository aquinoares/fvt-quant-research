name: Secret scan — full Git history

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — all fetched refs and history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all advertised Git refs
        shell: bash
        run: |
          set -euo pipefail
          # Keep all advertised branches, tags, and pull-request refs reachable to --all.
          # The repository is public; checkout credentials are deliberately not persisted.
          git fetch origin '+refs/*:refs/remotes/origin-all/*'

      - name: Download and verify official Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" \
            --output "$workdir/$asset"

          printf '%s  %s\n' "$expected_sha256" "$workdir/$asset" | sha256sum --check --status || {
            echo "ERROR: official Gitleaks archive checksum verification failed."
            exit 1
          }

          tar -xzf "$workdir/$asset" -C "$workdir" gitleaks
          install -m 0755 "$workdir/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "Official Gitleaks v${version} downloaded; SHA-256 verified."

      - name: Scan full history without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d "$RUNNER_TEMP/gitleaks-scan.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          report="$workdir/report.json"

          # Never stream scanner stdout/stderr: raw scanner output can contain sensitive matches.
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$report" \
            . >"$workdir/stdout.log" 2>"$workdir/stderr.log"
          scan_status=$?
          set -e

          python - "$report" "$scan_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          scan_status = int(sys.argv[2])

          try:
              findings = json.loads(report_path.read_text(encoding="utf-8"))
          except Exception:
              print("ERROR: Gitleaks did not produce a readable JSON report; raw output was suppressed.")
              raise SystemExit(2)

          if not isinstance(findings, list):
              print("ERROR: Gitleaks report has an unexpected format; raw output was suppressed.")
              raise SystemExit(2)

          def safe_field(item, *keys):
              value = next((item.get(key) for key in keys if item.get(key) is not None), "")
              # JSON-escape untrusted metadata so filenames cannot forge extra log lines.
              return json.dumps(str(value), ensure_ascii=True)

          if findings:
              for item in findings:
                  if not isinstance(item, dict):
                      continue
                  rule = safe_field(item, "RuleID", "ruleID", "rule_id")
                  file_name = safe_field(item, "File", "file")
                  commit = safe_field(item, "Commit", "commit")
                  print(f"rule={rule} | file={file_name} | commit={commit}")
              raise SystemExit(1)

          if scan_status != 0:
              print(f"ERROR: Gitleaks exited with code {scan_status} and no reportable findings; raw output was suppressed.")
              raise SystemExit(2)

          print("Gitleaks result: no findings in the history reachable from fetched refs.")
          PY
