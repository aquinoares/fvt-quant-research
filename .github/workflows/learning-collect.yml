name: Learning Track — Public Candle Collector

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

# One state writer at a time; queued runs are not cancelled.
concurrency:
  group: learning-public-candle-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect public BTCUSDT candles
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code from the triggering ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Restore persisted Trilha A state from learning-state
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --depth=1 origin refs/heads/learning-state:refs/remotes/origin/learning-state
          state_dir="$RUNNER_TEMP/learning-state"
          git worktree add --detach "$state_dir" refs/remotes/origin/learning-state

          mkdir -p learning/data learning/reports learning/experiments
          rsync -a --delete "$state_dir/learning/data/" learning/data/
          rsync -a --delete "$state_dir/learning/reports/" learning/reports/
          for report in latest_backtest.json latest_backtest.md; do
            if [[ -f "$state_dir/learning/experiments/$report" ]]; then
              cp "$state_dir/learning/experiments/$report" "learning/experiments/$report"
            else
              rm -f "learning/experiments/$report"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect, report, and run educational baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python -m learning.collector --root learning --max-requests 10
          collect_status=$?
          python -m learning.experiments.backtest --root learning
          backtest_status=$?
          set -e

          # Commit only generated public Trilha A state in the dedicated worktree.
          # The helper unions CSV partitions by (symbol, interval, open_time_ms),
          # preserving newer rows already present on learning-state.
          state_dir="$RUNNER_TEMP/learning-state"
          git -C "$state_dir" config user.name "github-actions[bot]"
          git -C "$state_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_succeeded=0
          for attempt in 1 2 3; do
            python -m learning.state_persistence --source-root learning --target-root "$state_dir/learning"
            git -C "$state_dir" add -- learning/data/ learning/reports/ learning/experiments/

            if git -C "$state_dir" diff --cached --quiet; then
              echo "No new Trilha A state changes; current learning-state already contains the generated state."
              push_succeeded=1
              break
            fi

            git -C "$state_dir" commit -m "learning: persist public collector state (attempt $attempt)"
            if git -C "$state_dir" push origin "HEAD:refs/heads/learning-state"; then
              echo "Trilha A state persisted to learning-state on attempt $attempt."
              push_succeeded=1
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error:: Push to learning-state failed after 3 attempts. The generated Trilha A state was not confirmed as persisted."
              exit 1
            fi

            echo "::warning:: Push to learning-state failed on attempt $attempt; fetching the latest state and reapplying generated artifacts before retry."
            if ! git -C "$state_dir" fetch --depth=1 origin refs/heads/learning-state; then
              echo "::error:: Could not fetch the latest learning-state after a failed push; aborting without force push."
              exit 1
            fi
            git -C "$state_dir" reset --hard FETCH_HEAD
          done

          if [[ "$push_succeeded" -ne 1 ]]; then
            echo "::error:: Could not persist Trilha A state to learning-state after 3 attempts."
            exit 1
          fi

          if [ "$collect_status" -ne 0 ]; then
            exit "$collect_status"
          fi
          exit "$backtest_status"
